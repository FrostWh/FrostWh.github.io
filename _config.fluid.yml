#---------------------------
# Hexo Theme Fluid
# 自定义配置文件
#---------------------------

# 导航栏
navbar:
  blog_title: "frostwang"
  menu:
    - { key: "home", link: "/", icon: "iconfont icon-home-fill" }
    - { key: "archive", link: "/archives/", icon: "iconfont icon-archive-fill" }
    - { key: "category", link: "/categories/", icon: "iconfont icon-category-fill" }
    - { key: "tag", link: "/tags/", icon: "iconfont icon-tags-fill" }
    - { key: "about", link: "/about/", icon: "iconfont icon-user-fill" }

# 首页
index:
  banner_img: /img/Home.jpeg
  banner_img_height: 100
  banner_mask_alpha: 0.3
  slogan:
    enable: true
    text: "记录学习与成长"
  auto_excerpt:
    enable: true
  post_meta:
    date: true
    category: true
    tag: true

# 文章页
post:
  banner_img: /img/Page.png
  banner_img_height: 70
  banner_mask_alpha: 0.3
  meta:
    date:
      enable: true
      format: "LL a"
    wordcount:
      enable: true
    min2read:
      enable: true
      awl: 2
      wpm: 60
    views:
      enable: true
      # 统计数据来源：使用 LeanCloud 同步到云端
      # Options: busuanzi | leancloud | umami
      source: "leancloud"
    # 点赞功能
    likes:
      enable: true
      # 点赞数据存储方式：localStorage（简单，但只能本地）或 leancloud（需要配置，可跨设备）
      # Options: localStorage | leancloud
      source: "leancloud"
  toc:
    enable: true
    placement: right
    headingSelector: "h1,h2,h3,h4,h5,h6"
    collapseDepth: 0
  copyright:
    enable: true
    license: 'BY'
    author:
      enable: true
    post_date:
      enable: true
      format: "LL"
  prev_next:
    enable: true
  image_zoom:
    enable: true
  comments:
    enable: true
    type: gitalk

# 关于页
about:
  enable: true
  banner_img: /img/About.jpg
  banner_img_height: 60
  banner_mask_alpha: 0.3
  avatar: /img/avatar.png
  name: "frostwang"
  intro: "个人技术博客，记录学习与成长"
  icons:
    - { class: "iconfont icon-github-fill", link: "https://github.com/FrostWh", tip: "GitHub" }

# 归档页
archive:
  banner_img: /img/Archives.jpeg
  banner_img_height: 60
  banner_mask_alpha: 0.3

# 分类页
category:
  enable: true
  banner_img: /img/Categories.png
  banner_img_height: 60
  banner_mask_alpha: 0.3
  order_by: "-length"
  post_order_by: "-date"

# 标签页
tag:
  enable: true
  banner_img: /img/Tag.jpg
  banner_img_height: 80
  banner_mask_alpha: 0.3
  tagcloud:
    min_font: 15
    max_font: 30
    unit: px
    start_color: "#BBBBEE"
    end_color: "#337ab7"

# 搜索
search:
  enable: true
  path: /local-search.xml
  generate_path: /local-search.xml
  field: post
  content: true

# 暗色模式
dark_mode:
  enable: true
  default: auto

# 代码高亮
code:
  copy_btn: true
  language:
    enable: true
    default: "TEXT"
  highlight:
    enable: true
    line_number: true
    lib: "highlightjs"
    highlightjs:
      style: "github gist"
      style_dark: "dark"

# 功能特性
fun_features:
  typing:
    enable: true
    typeSpeed: 70
    cursorChar: "_"
    loop: false
  anchorjs:
    enable: true
    element: h1,h2,h3,h4,h5,h6
    placement: left
    visible: hover
  progressbar:
    enable: true
    height_px: 3
    color: "#29d"
    options: { showSpinner: false, trickleSpeed: 100 }

# Gitalk 评论配置
# 基于 GitHub Issues
# See: https://github.com/gitalk/gitalk#options
gitalk:
  clientID: "Ov23li9MGLmLUAdJxmw1"
  clientSecret: "0dfc082235a7789ca76246060a9800e8a166fb62"
  repo: "FrostWh.github.io"
  owner: "FrostWh"
  admin: ["FrostWh"]
  language: "zh-CN"
  labels: ["Gitalk"]
  perPage: 10
  pagerDirection: last
  distractionFreeMode: false
  createIssueManually: false
  # 默认 proxy 可能会失效，如果遇到问题可以更换其他代理
  proxy: https://cors-anywhere.azm.workers.dev/https://github.com/login/oauth/access_token

# 网站统计配置
# 用于显示网站总 PV 和 UV，以及文章浏览数统计
web_analytics:
  enable: true  # 必须启用，否则浏览数不会增加，只会查询
  # LeanCloud 统计配置（用于浏览数、点赞和网站统计）
  leancloud:
    app_id: "LMwqda8ySnf0uS6WGCClJvVj-MdYXbMMI"
    app_key: "tRKr9DQ7NRd99oF5iNQE5e65"
    server_url: ""  # 仅中国大陆用户需要填写，国际版留空
    ignore_local: false  # 是否忽略本地访问统计
    # 统计页面时获取路径的属性
    path: window.location.pathname

# 网站底部统计显示（可选）
footer:
  statistics:
    enable: true
    # 统计数据来源：使用 LeanCloud 与文章浏览数保持一致
    # Options: busuanzi | leancloud | umami
    source: "leancloud"

# 自定义 CSS 和 JS 文件
# 点赞功能的样式和脚本
custom_css:
  - /css/like-button.css

custom_js:
  - /js/like-button.js

